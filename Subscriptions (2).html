<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2744">
<title>Study Academy — نظام الاشتراكات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#0f2744;--blue:#1a4a8a;--mid:#2e75b6;--gold:#c9a84c;
  --green:#1e6b3c;--green-l:#d8f3e0;--gold-d:#7d5e00;
  --red:#dc2626;--red-l:#ffe1e1;--amber:#b8860b;--amber-l:#fff3d6;
  --gray:#f4f6f9;--text:#1a1a2e;--line:#e2e8f0;
  --shadow:0 10px 40px rgba(15,39,68,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:
  radial-gradient(1000px 500px at 100% -10%, rgba(26,74,138,.06), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(201,168,76,.07), transparent 55%),
  linear-gradient(180deg,#f4f7fb,#eef2f8);background-attachment:fixed;min-height:100vh;color:var(--text)}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0f2744,#1b3a5f);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#gate .gate-box{background:#fff;padding:34px 30px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center;width:300px;max-width:90%}
#gate h2{color:#0f2744;font-size:20px;margin-bottom:6px}
#gate p{color:#666;font-size:13px;margin-bottom:18px}
#gate input{width:100%;padding:13px;font-size:18px;text-align:center;letter-spacing:6px;border:2px solid #e2e8f0;border-radius:12px;font-family:'Cairo',sans-serif;margin-bottom:12px}
#gate input:focus{outline:none;border-color:#1b3a5f}
#gate button{width:100%;padding:13px;background:linear-gradient(135deg,#0f2744,#2563eb);color:#fff;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
#gate .err{color:#dc2626;font-size:13px;font-weight:700;height:18px}
#gate .logo-g{font-size:30px;color:#d4a960;font-weight:800;letter-spacing:1px}

.header{background:linear-gradient(135deg,#0f2744,#1a4a8a);border-bottom:3px solid var(--gold);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(15,39,68,.18)}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:46px;border-radius:8px;background:#fff;padding:3px}
.logo h1{color:#fff;font-size:17px;font-weight:900;line-height:1.1}
.logo p{color:rgba(255,255,255,.7);font-size:11px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid rgba(15,39,68,.05)}
.card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-title .icon{background:var(--navy);color:#fff;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex:1;min-width:130px;text-align:center;box-shadow:var(--shadow);border-top:3px solid var(--navy)}
.stat.green{border-top-color:var(--green)}.stat.amber{border-top-color:var(--amber)}.stat.red{border-top-color:var(--red)}
.stat .num{font-size:26px;font-weight:800;color:var(--navy)}
.stat.green .num{color:var(--green)}.stat.amber .num{color:var(--amber)}.stat.red .num{color:var(--red)}
.stat .lbl{font-size:12px;color:#777;margin-top:3px;font-weight:700}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:12px;font-weight:700;color:#555}
.fg input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;background:var(--gray)}
.fg input:focus{outline:none;border-color:var(--mid);background:#fff}
.btn-add{width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(29,78,143,.3)}
.btn-add:hover{transform:translateY(-1px)}

.alert-box{background:var(--amber-l);border:1px solid #f0d98c;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.alert-box h3{font-size:14px;color:var(--amber);margin-bottom:8px;font-weight:800}
.alert-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #f0e0b0;border-radius:8px;padding:7px 11px;margin:4px 0;font-size:12px}
.alert-row .nm{font-weight:700;color:var(--navy)}
.alert-empty{font-size:12px;color:#999}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:0;padding:13px 16px;background:var(--gray);border-bottom:1px solid var(--line)}
.toolbar span{font-size:11px;color:#666;font-weight:700}
.fb{padding:6px 14px;border-radius:20px;border:1px solid var(--line);font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;cursor:pointer;background:#fff;opacity:.7}
.fb.active,.fb:hover{opacity:1}
.fb.all.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.fb.active-s.active{background:var(--green);color:#fff;border-color:var(--green)}
.fb.soon.active{background:var(--amber);color:#fff;border-color:var(--amber)}
.fb.exp.active{background:var(--red);color:#fff;border-color:var(--red)}
.search-box{flex:1;min-width:180px}
.search-box input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px}
.search-box input:focus{outline:none;border-color:var(--navy)}
.btn-print{padding:8px 14px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

.tbl-wrap{overflow-x:auto;background:#fff;border-radius:0 0 18px 18px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--navy)}
thead th{padding:12px 12px;font-size:12px;font-weight:700;color:#fff;text-align:center;white-space:nowrap;border-bottom:2px solid var(--gold)}
tbody tr{border-bottom:1px solid #f0f4f8}
tbody tr:hover{background:#f8fbff}
tbody td{padding:10px 12px;font-size:13px;text-align:center;vertical-align:middle}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.b-active{background:var(--green-l);color:var(--green)}
.b-soon{background:var(--amber-l);color:var(--amber)}
.b-exp{background:var(--red-l);color:var(--red)}
.row-exp{background:#fff6f6}
.row-soon{background:#fffbf0}
.act-btns{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bt{border:none;cursor:pointer;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;font-family:'Cairo',sans-serif;white-space:nowrap;transition:.15s}
.bt-renew{background:var(--green-l);color:var(--green)}.bt-renew:hover{background:var(--green);color:#fff}
.bt-edit{background:#e8f0fb;color:var(--blue)}.bt-edit:hover{background:var(--blue);color:#fff}
.bt-del{background:var(--red-l);color:var(--red)}.bt-del:hover{background:var(--red);color:#fff}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,39,68,.5);z-index:500;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:26px;width:90%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:18px}
.modal .form-grid{grid-template-columns:1fr 1fr}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.btn-save{flex:1;padding:11px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.btn-cancel{flex:1;padding:11px;background:var(--gray);color:#555;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:30px;font-size:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){.form-grid{grid-template-columns:1fr 1fr}.wrap{padding:14px 10px}}
@media print{#gate,.header .stats,.card,.toolbar,.alert-box,.btn-print,.act-btns,th:last-child,td:last-child{display:none!important}body{background:#fff}}
</style>
</head>

function today(){return new Date().toISOString().slice(0,10)}
function daysLeft(expiry){
  if(!expiry) return null;
  const e=new Date(expiry+'T00:00:00'), t=new Date(today()+'T00:00:00');
  return Math.round((e-t)/86400000);
}
function statusOf(expiry){
  const d=daysLeft(expiry);
  if(d===null) return 'active';
  if(d<0) return 'exp';
  if(d<=2) return 'soon';
  return 'active';
}
function fmtD(s){ if(!s) return '—'; const[y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }

subsRef.on('value',(snap)=>{
  const data=snap.val();
  if(data===null && !seeded){
    seeded=true; const obj={};

    subsRef.set(obj); return;
  }
  subs=data?Object.values(data):[];
  nextId=subs.length?Math.max(...subs.map(s=>s.id))+1:1;
  render();
},(err)=>{console.error(err);showToast('⚠️ خطأ بالاتصال');});

    phone:document.getElementById('e-phone').value.trim(),
    notes:document.getElementById('e-notes').value.trim()});
  closeModal(); showToast('✅ تم التعديل!');
}
function delSub(id){
  const s=subs.find(x=>x.id===id);
  if(!confirm('حذف اشتراك "'+(s?s.name:'')+'"؟')) return;
  subsRef.child(id).remove(); showToast('🗑️ تم الحذف');
}

// تجديد سريع — تختار المدة، تنضاف على تاريخ الانتهاء الحالي
function renewSub(id){
  const s=subs.find(x=>x.id===id); if(!s)return;
  const inp=prompt('تجديد اشتراك "'+s.name+'"\nكم يوم تريد أن تضيف على تاريخ الانتهاء الحالي؟\n(مثلاً: 30 لشهر، 7 لأسبوع)','30');
  if(inp===null) return;
  const days=parseInt(inp);
  if(isNaN(days)||days<=0){showToast('⚠️ اكتب عدد أيام صحيح');return}
  const base=s.expiry?new Date(s.expiry+'T00:00:00'):new Date();
  base.setDate(base.getDate()+days);
  const newExp=base.toISOString().slice(0,10);
  subsRef.child(id).child('expiry').set(newExp);
  showToast('♻️ تم التجديد حتى '+fmtD(newExp));
}

function setFilter(f,el){filter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}

function render(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  let total=subs.length,active=0,soon=0,exp=0;
  const stOrder={active:0,soon:1,exp:2};
  const sorted=[...subs].sort((a,b)=>{
    const sa=stOrder[statusOf(a.expiry)], sb=stOrder[statusOf(b.expiry)];
    if(sa!==sb) return sa-sb;                       // نشطة ثم قريبة ثم منتهية
    return (a.expiry||'').localeCompare(b.expiry||''); // داخل كل مجموعة حسب الأقرب انتهاءً
  });
  let rows='',n=0;
  for(const s of sorted){
    const st=statusOf(s.expiry);
    if(st==='active')active++; else if(st==='soon')soon++; else exp++;
    if(filter!=='all'&&filter!==st) continue;
    if(q && !((s.name||'').toLowerCase().includes(q) || String(s.barcode||'').includes(q) || (s.phone||'').includes(q) || (s.notes||'').toLowerCase().includes(q))) continue;
    n++;
    const d=daysLeft(s.expiry);
    const left = d===null?'—' : (d<0?('منذ '+Math.abs(d)+' يوم'):(d===0?'اليوم':(d+' يوم')));
    const badge = st==='active'?'<span class="badge b-active">✅ نشطة</span>':(st==='soon'?'<span class="badge b-soon">⏳ قريبة</span>':'<span class="badge b-exp">❌ منتهية</span>');
    const rc = st==='exp'?'row-exp':(st==='soon'?'row-soon':'');
    rows+='<tr class="'+rc+'">'+
      '<td>'+n+'</td>'+
      '<td style="text-align:right;font-weight:700">'+(s.name||'')+
        (s.phone?'<span style="display:block;font-size:11px;color:#2563eb;font-weight:400;direction:ltr;text-align:right">📞 '+s.phone+'</span>':'')+
        (s.notes?'<span style="display:block;font-size:11px;color:#777;font-weight:400">📝 '+s.notes+'</span>':'')+
      '</td>'+
      '<td>'+(s.barcode||'')+'</td>'+
      '<td>'+fmtD(s.issue)+'</td>'+
      '<td>'+fmtD(s.expiry)+'</td>'+
      '<td>'+left+'</td>'+
      '<td>'+badge+'</td>'+
      '<td><div class="act-btns">'+
        '<button class="bt bt-renew" onclick="renewSub('+s.id+')">♻️ تجديد</button>'+
        '<button class="bt bt-edit" onclick="openEdit('+s.id+')">✏️ تعديل</button>'+
        '<button class="bt bt-del" onclick="delSub('+s.id+')">🗑️</button>'+
      '</div></td>'+
    '</tr>';
  }
  document.getElementById('tbody').innerHTML=rows||'<tr><td colspan="8" style="padding:30px;color:#bbb">لا توجد نتائج</td></tr>';
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-active').textContent=active;
  document.getElementById('st-soon').textContent=soon;
  document.getElementById('st-exp').textContent=exp;
  buildAlert();
}

function buildAlert(){
  const box=document.getElementById('alert-box');
  const soonList=subs.filter(s=>statusOf(s.expiry)==='soon').sort((a,b)=>(a.expiry||'').localeCompare(b.expiry||''));
  if(soonList.length===0){
    box.innerHTML='<h3>⏳ اشتراكات قريبة الانتهاء</h3><div class="alert-empty">لا توجد اشتراكات قريبة من الانتهاء حالياً ✅</div>';
    return;
  }
  box.innerHTML='<h3>⏳ اشتراكات قريبة الانتهاء ('+soonList.length+')</h3>'+
    soonList.map(s=>{
      const d=daysLeft(s.expiry);
      const txt=d===0?'تنتهي اليوم':('باقي '+d+' يوم');
      return '<div class="alert-row"><span class="nm">'+(s.name||'')+' — '+(s.barcode||'')+'</span><span style="color:var(--amber);font-weight:700">'+txt+' ('+fmtD(s.expiry)+')</span></div>';
    }).join('');
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
</script>
