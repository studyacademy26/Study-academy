<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Academy — إدارة الحجوزات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2744;--blue:#1a4a8a;--mid:#2e75b6;
  --pale:#e8f4fd;--very-light:#deeaf1;--gold:#c9a84c;
  --green:#1e6b3c;--green-l:#c6efce;
  --yellow:#ffeb9c;--yellow-d:#7d4e00;
  --red:#ffcccc;--red-d:#9c0006;
  --gray:#f4f6f9;--white:#fff;--text:#1a1a2e;
  --shadow:0 4px 24px rgba(15,39,68,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#0f2744,#1a4a8a 50%,#0f2744);min-height:100vh;color:var(--text)}

.header{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.12);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;background:var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px}
.logo h1{color:#fff;font-size:17px;font-weight:900;line-height:1.1}
.logo p{color:rgba(255,255,255,.65);font-size:11px}
.stats{display:flex;gap:10px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 13px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%}

.wrap{max-width:1080px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card-title .icon{background:var(--navy);color:#fff;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:5px}
.fg input,.fg select{width:100%;padding:9px 12px;border:2px solid #e2e8f0;border-radius:10px;font-family:'Cairo',sans-serif;font-size:12px;color:var(--text);background:var(--gray);transition:.2s;direction:ltr;text-align:right}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--mid);box-shadow:0 0 0 3px rgba(46,117,182,.1);background:#fff}
.btn-add{width:100%;padding:12px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,39,68,.28)}

.sched-wrap{border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.sched-head{background:linear-gradient(135deg,var(--navy),var(--blue));padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.sched-head h2{color:#fff;font-size:15px;font-weight:700}
.sched-head p{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}
.filter-row{padding:13px 16px;background:var(--pale);border-bottom:1px solid #e2e8f0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-row span{font-size:11px;color:#666;font-weight:700}
.fb{padding:5px 14px;border-radius:20px;border:2px solid transparent;font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:.2s;opacity:.55}
.fb.active,.fb:hover{opacity:1}
.fb.all{background:var(--navy);color:#fff;opacity:1}
.fb.free{background:var(--green-l);color:var(--green);border-color:var(--green)}
.fb.partial{background:var(--yellow);color:var(--yellow-d);border-color:var(--yellow-d)}
.fb.booked{background:var(--red);color:var(--red-d);border-color:var(--red-d)}

.tbl-wrap{overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--navy)}
thead th{padding:11px 14px;font-size:11px;font-weight:700;color:#fff;text-align:center;white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f4f8;transition:.15s}
tbody tr:hover{filter:brightness(.96)}
tbody td{padding:10px 14px;font-size:12px;text-align:center;vertical-align:middle}
.month-sep td{background:var(--blue)!important;color:#fff!important;font-weight:700!important;font-size:12px!important;text-align:right!important;padding:7px 18px!important}
.row-free{background:var(--green-l)}
.row-partial{background:var(--yellow)}
.row-booked{background:var(--red)}
.row-past{background:#f0f0f0;color:#aaa}
.row-today{background:#fff9e6;outline:2px solid var(--gold);outline-offset:-2px}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;white-space:nowrap}
.b-free{background:var(--green);color:#fff}
.b-partial{background:var(--yellow-d);color:#fff}
.b-booked{background:var(--red-d);color:#fff}
.b-past{background:#aaa;color:#fff}

/* وقت الحجز — دائماً LTR */
.bk-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:3px 0;direction:ltr;text-align:left}
.bk-time{color:var(--blue);font-weight:700;white-space:nowrap;font-size:12px}
.bk-client{color:var(--text);font-size:12px}
.no-bk{color:#ccc}

/* أزرار تعديل وحذف */
.actions{display:flex;flex-direction:column;gap:4px;align-items:center}
.btn-edit{background:#e8f4fd;border:none;color:var(--blue);cursor:pointer;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;transition:.15s;font-family:'Cairo',sans-serif;white-space:nowrap}
.btn-edit:hover{background:var(--mid);color:#fff}
.btn-del{background:#ffe0e0;border:none;color:var(--red-d);cursor:pointer;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;transition:.15s;font-family:'Cairo',sans-serif;white-space:nowrap}
.btn-del:hover{background:var(--red-d);color:#fff}

/* Modal تعديل */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:28px;width:90%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:20px}
.modal .form-grid{grid-template-columns:1fr 1fr}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-save{flex:1;padding:11px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.btn-cancel{flex:1;padding:11px;background:var(--gray);color:var(--text);border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:30px;font-size:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){.stats{display:none}.form-grid{grid-template-columns:1fr 1fr}.wrap{padding:14px 10px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <div>
      <h1>Study Academy</h1>
      <p>نظام إدارة حجوزات القاعة</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span class="dot" style="background:#4ade80"></span><span id="s-free">0</span> فارغ</div>
    <div class="stat"><span class="dot" style="background:#fbbf24"></span><span id="s-part">0</span> جزئي</div>
    <div class="stat"><span class="dot" style="background:#f87171"></span><span id="s-book">0</span> ممتلئ</div>
  </div>
</div>

<div class="wrap">

  <!-- فورم إضافة -->
  <div class="card">
    <div class="card-title"><div class="icon">+</div> إضافة حجز جديد</div>
    <div class="form-grid">
      <div class="fg"><label>📅 التاريخ</label><input type="date" id="f-date"></div>
      <div class="fg"><label>⏰ وقت البداية</label><input type="time" id="f-start" value="09:00"></div>
      <div class="fg"><label>⏰ وقت النهاية</label><input type="time" id="f-end" value="11:00"></div>
      <div class="fg"><label>👤 اسم العميل</label><input type="text" id="f-client" placeholder="مثال: Mr. Ghassan"></div>
      <div class="fg"><label>📋 نوع الحجز</label>
        <select id="f-type">
          <option>Lecture Hall</option>
          <option>Presentation</option>
          <option>English for Life Camp</option>
          <option>Training</option>
          <option>Meeting</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fg"><label>💰 المبلغ</label><input type="text" id="f-amount" placeholder="مثال: 25$"></div>
    </div>
    <button class="btn-add" onclick="addBooking()">✅ إضافة الحجز وتحديث الجدول</button>
  </div>

  <!-- الجدول -->
  <div class="sched-wrap">
    <div class="sched-head">
      <div><h2>🗓 جدول الأوقات المتاحة</h2><p id="sched-range"></p></div>
    </div>
    <div class="filter-row">
      <span>عرض:</span>
      <button class="fb all active" onclick="setFilter('all',this)">الكل</button>
      <button class="fb free" onclick="setFilter('free',this)">✅ فارغ</button>
      <button class="fb partial" onclick="setFilter('partial',this)">⚠️ جزئي</button>
      <button class="fb booked" onclick="setFilter('booked',this)">🔴 ممتلئ</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>التاريخ</th><th>اليوم</th><th>الحالة</th><th>الحجوزات</th><th>إجراء</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal تعديل -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>✏️ تعديل الحجز</h3>
    <input type="hidden" id="e-id">
    <div class="form-grid modal" style="display:grid">
      <div class="fg"><label>📅 التاريخ</label><input type="date" id="e-date"></div>
      <div class="fg"><label>⏰ وقت البداية</label><input type="time" id="e-start"></div>
      <div class="fg"><label>⏰ وقت النهاية</label><input type="time" id="e-end"></div>
      <div class="fg"><label>👤 اسم العميل</label><input type="text" id="e-client"></div>
      <div class="fg"><label>📋 نوع الحجز</label>
        <select id="e-type">
          <option>Lecture Hall</option>
          <option>Presentation</option>
          <option>English for Life Camp</option>
          <option>Training</option>
          <option>Meeting</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fg"><label>💰 المبلغ</label><input type="text" id="e-amount"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-save" onclick="saveEdit()">💾 حفظ التعديل</button>
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let bookings = [
  {id:1,  date:'2026-05-28',start:'12:00',end:'18:00',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:2,  date:'2026-05-29',start:'12:00',end:'18:00',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:3,  date:'2026-05-30',start:'10:00',end:'15:00',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:4,  date:'2026-05-31',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:5,  date:'2026-06-01',start:'12:00',end:'18:00',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:6,  date:'2026-06-02',start:'11:00',end:'12:00',client:'معهد المعرفة للتدريب', type:'Lecture Hall',           amount:''},
  {id:7,  date:'2026-06-02',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:8,  date:'2026-06-03',start:'11:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:9,  date:'2026-06-04',start:'11:00',end:'13:00',client:'دارين ياغي',            type:'Lecture Hall',           amount:''},
  {id:10, date:'2026-06-04',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:11, date:'2026-06-05',start:'11:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:12, date:'2026-06-06',start:'10:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:13, date:'2026-06-07',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:14, date:'2026-06-08',start:'11:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:15, date:'2026-06-09',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:16, date:'2026-06-10',start:'11:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:17, date:'2026-06-11',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:18, date:'2026-06-12',start:'11:00',end:'22:30',client:'Med-Fit',               type:'Presentation',          amount:'25$'},
  {id:19, date:'2026-06-14',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:20, date:'2026-06-16',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:21, date:'2026-06-18',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:22, date:'2026-06-21',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:23, date:'2026-06-23',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:24, date:'2026-06-25',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:25, date:'2026-06-28',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:26, date:'2026-06-30',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
  {id:27, date:'2026-07-02',start:'17:00',end:'19:00',client:'Mr. Ghassan',           type:'English for Life Camp', amount:''},
];
let nextId = 28;
let filter = 'all';

const DAYS   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// تحويل HH:MM لنص 12 ساعة — دائماً LTR
function fmtT(t){
  const[h,m]=t.split(':').map(Number);
  const ap=h>=12?'PM':'AM', h12=h%12||12;
  return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ap}`;
}

function today(){ return new Date().toISOString().slice(0,10) }

function addBooking(){
  const date=document.getElementById('f-date').value;
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  const client=document.getElementById('f-client').value.trim();
  const type=document.getElementById('f-type').value;
  const amount=document.getElementById('f-amount').value.trim();
  if(!date||!start||!end||!client){showToast('⚠️ يرجى تعبئة التاريخ والأوقات واسم العميل');return}
  if(start>=end){showToast('⚠️ وقت النهاية يجب أن يكون بعد البداية');return}
  bookings.push({id:nextId++,date,start,end,client,type,amount});
  document.getElementById('f-client').value='';
  document.getElementById('f-amount').value='';
  render();
  showToast('✅ تم إضافة الحجز!');
}

function delBooking(id){
  if(!confirm('هل تريد حذف هذا الحجز؟')) return;
  bookings=bookings.filter(b=>b.id!==id);
  render();
  showToast('🗑️ تم الحذف');
}

function openEdit(id){
  const b=bookings.find(x=>x.id===id);
  if(!b) return;
  document.getElementById('e-id').value=id;
  document.getElementById('e-date').value=b.date;
  document.getElementById('e-start').value=b.start;
  document.getElementById('e-end').value=b.end;
  document.getElementById('e-client').value=b.client;
  document.getElementById('e-type').value=b.type;
  document.getElementById('e-amount').value=b.amount;
  document.getElementById('modal').classList.add('open');
}

function saveEdit(){
  const id=parseInt(document.getElementById('e-id').value);
  const date=document.getElementById('e-date').value;
  const start=document.getElementById('e-start').value;
  const end=document.getElementById('e-end').value;
  const client=document.getElementById('e-client').value.trim();
  if(!date||!start||!end||!client){showToast('⚠️ يرجى تعبئة الحقول');return}
  if(start>=end){showToast('⚠️ وقت النهاية يجب أن يكون بعد البداية');return}
  const idx=bookings.findIndex(b=>b.id===id);
  if(idx>-1){
    bookings[idx]={...bookings[idx],date,start,end,client,
      type:document.getElementById('e-type').value,
      amount:document.getElementById('e-amount').value.trim()};
  }
  closeModal();
  render();
  showToast('✅ تم التعديل!');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

// إغلاق Modal بالضغط خارجه
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

function render(){
  const now=today();
  // من أول الجدول الحالي أو اليوم — حتى نهاية 2026
  const startD=new Date('2026-05-28');
  const endD=new Date('2026-12-31');

  const byDay={};
  for(const b of bookings)(byDay[b.date]=byDay[b.date]||[]).push(b);

  let rows='',prevM='',cf=0,cp=0,cb=0;
  let cur=new Date(startD);

  while(cur<=endD){
    const ds=cur.toISOString().slice(0,10);
    const bks=(byDay[ds]||[]).sort((a,b)=>a.start.localeCompare(b.start));
    const isPast=ds<now, isToday=ds===now;
    const mk=ds.slice(0,7);

    if(mk!==prevM){
      prevM=mk;
      rows+=`<tr class="month-sep"><td colspan="5">── ${MONTHS[cur.getMonth()]} ${cur.getFullYear()} ──</td></tr>`;
    }

    let sc,sb,rc;
    if(isPast){sc='b-past';sb='منتهي';rc='row-past'}
    else if(bks.length===0){sc='b-free';sb='✅ فارغ';rc='row-free';cf++}
    else{sc='b-partial';sb='⚠️ جزئي';rc='row-partial';cp++}
    if(isToday) rc='row-today';

    if(filter==='free'    && sb!=='✅ فارغ'){cur.setDate(cur.getDate()+1);continue}
    if(filter==='partial' && sb!=='⚠️ جزئي'){cur.setDate(cur.getDate()+1);continue}
    if(filter==='booked'  && sb!=='🔴 ممتلئ'){cur.setDate(cur.getDate()+1);continue}

    // عرض الحجوزات بـ LTR دائماً
    const bkHtml=bks.length===0
      ?'<span class="no-bk">—</span>'
      :bks.map(b=>`
        <div class="bk-row">
          <span class="bk-time">${fmtT(b.start)} – ${fmtT(b.end)}</span>
          <span class="bk-client">(${b.client})</span>
        </div>`).join('');

    // أزرار إجراء لكل حجز
    const actHtml=bks.map(b=>`
      <div style="display:flex;gap:4px;justify-content:center;margin:2px 0">
        <button class="btn-edit" onclick="openEdit(${b.id})">✏️ تعديل</button>
        <button class="btn-del"  onclick="delBooking(${b.id})">🗑️ حذف</button>
      </div>`).join('');

    const dd=`${String(cur.getDate()).padStart(2,'0')}/${String(cur.getMonth()+1).padStart(2,'0')}/${cur.getFullYear()}`;

    rows+=`<tr class="${rc}">
      <td><strong>${dd}</strong>${isToday?' <span style="color:var(--gold);font-size:10px">اليوم</span>':''}</td>
      <td>${DAYS[cur.getDay()]}</td>
      <td><span class="badge ${sc}">${sb}</span></td>
      <td>${bkHtml}</td>
      <td>${actHtml||'—'}</td>
    </tr>`;

    cur.setDate(cur.getDate()+1);
  }

  document.getElementById('tbody').innerHTML=rows||'<tr><td colspan="5" style="padding:30px;color:#bbb;text-align:center">لا توجد نتائج</td></tr>';
  document.getElementById('s-free').textContent=cf;
  document.getElementById('s-part').textContent=cp;
  document.getElementById('s-book').textContent=cb;
  document.getElementById('sched-range').textContent='28/05/2026 – 31/12/2026';
}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

document.getElementById('f-date').value=today();
render();
</script>
